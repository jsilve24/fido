# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, develop, plot-bug-fix, rng_update, config-tests, build-platform-harness]

  pull_request:
    branches: [main, master, develop]

  workflow_dispatch:

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}, ${{ matrix.config.profile }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: 'release', profile: default, openmp: 'false', mkl: 'false'}
          - {os: windows-latest, r: 'release', profile: default, openmp: 'true', mkl: 'false'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release', profile: default, openmp: 'true', mkl: 'false'}
          - {os: ubuntu-latest, r: 'release', profile: default, openmp: 'true', mkl: 'false'}
          - {os: ubuntu-latest, r: 'oldrel-1', profile: default, openmp: 'true', mkl: 'false'}
          - {os: ubuntu-latest, r: 'release', profile: mkl, openmp: 'true', mkl: 'true'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      FIDO_EXPECT_OPENMP: ${{ matrix.config.openmp }}
      FIDO_EXPECT_MKL: ${{ matrix.config.mkl }}
      OMP_NUM_THREADS: 2
      MKL_NUM_THREADS: 2

    steps:
      - name: Configure git
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: actions/setup-python@v5
        if: matrix.config.profile == 'mkl'
        with:
          python-version: '3.12'

      - name: Install pinned MKL
        if: matrix.config.profile == 'mkl'
        shell: bash
        run: |
          bash .github/build/install-mkl.sh "$RUNNER_TEMP/fido-mkl"
          echo "FIDO_CONFIGURE_ARGS=--with-mkl=$RUNNER_TEMP/fido-mkl" >> "$GITHUB_ENV"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-results: false
          upload-snapshots: true
          args: >-
            c('--no-manual', '--as-cran',
              if (nzchar(Sys.getenv('FIDO_CONFIGURE_ARGS')))
                paste0('--install-args=--configure-args=', Sys.getenv('FIDO_CONFIGURE_ARGS'))
              else character())

      - name: Show testthat output
        if: always()
        run: find check -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
